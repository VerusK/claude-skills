# External skills. Every source is pinned: `ref` is a full commit sha (never a branch) and
# `license` is the SPDX id from the upstream LICENSE. `make sync` fetches exactly that commit;
# `make sync-update` (weekly workflow, or by hand) moves the pin to the upstream head.
# `mode: merge` (default) syncs into skills/<name>/ via 3-way merge;
# `mode: watch` only tracks upstream in vendor/<name>/ and reports diffs.
# `patch: true` marks sources with local edits; `make repatch` records them in patches/.
sources:
